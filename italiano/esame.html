<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1d2730">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idiomas">
<title>Examen final — Italiano</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="italiano.css">
<style>
  .q-from { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .repasa { text-align: left; margin-top: 14px; font-size: 14px; }
  .repasa a { color: var(--verde); font-weight: 700; }
  .repasa li { margin: 4px 0 4px 18px; }
</style>
</head>
<body>
<div class="flag-strip"><i></i><i></i><i></i></div>
<div class="top">
  <a href="index.html">← Clases</a>
  <span class="brand">Italiano 🇮🇹</span>
</div>

<div class="wrap">
  <div class="kicker" id="kicker"></div>
  <h1>Esame <em>finale</em></h1>
  <p class="lead" id="lead"></p>

  <div id="quiz" style="margin-top:20px"></div>
  <button class="btn" id="check">Corregir examen</button>
  <div class="result" id="result">
    <div class="big" id="score"></div>
    <div id="score-msg"></div>
    <div class="repasa" id="repasa"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn ghost" onclick="location.reload()">Otro examen</button>
      <a class="btn" href="index.html">Volver a las clases</a>
    </div>
  </div>
</div>

<script src="lezioni.js"></script>
<script src="parole.js"></script>
<script src="progreso.js"></script>
<script>
  Progreso.contarTiempo();
  const NIVELES = [...new Set(LEZIONI.map(l => l.level || 'A1'))];
  let lv = new URLSearchParams(location.search).get('l');
  if (!NIVELES.includes(lv)) lv = NIVELES[0];
  const PASA = 0.8, N_CLASES = 14, N_VOCAB = 6;
  document.title = `Examen ${lv} — Italiano`;
  document.getElementById('kicker').textContent = `Nivel ${lv} · ${N_CLASES + N_VOCAB} preguntas`;
  document.getElementById('lead').textContent =
    `Preguntas al azar de todas las clases ${lv} y de su vocabulario. Necesitas ${PASA * 100}% para aprobar el nivel. Cada vez que lo repites salen preguntas distintas.`;

  const mezclar = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Preguntas de las clases del nivel
  const deClases = [];
  LEZIONI.forEach((l, idx) => { if ((l.level || 'A1') === lv) l.quiz.forEach(q => deClases.push({ ...q, from: l.title, n: idx + 1 })); });
  let preguntas = mezclar(deClases).slice(0, N_CLASES);

  // Preguntas de vocabulario: ¿cómo se dice…?
  const palabras = (PAROLE[lv] || []).flatMap(c => c.words);
  mezclar(palabras).slice(0, N_VOCAB).forEach(w => {
    const otras = mezclar(palabras.filter(x => x !== w)).slice(0, 2).map(x => x[0]);
    const opts = mezclar([w[0], ...otras]);
    preguntas.push({ q: `¿Cómo se dice “${w[2]}”?`, opts, a: opts.indexOf(w[0]), from: 'Vocabulario ' + lv, voc: w });
  });
  preguntas = mezclar(preguntas);

  // ---- Audio ----
  let itVoice = null;
  function pickVoice() { const vs = speechSynthesis.getVoices(); itVoice = vs.find(v => v.lang === 'it-IT') || vs.find(v => v.lang && v.lang.startsWith('it')) || null; }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(t) { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'it-IT'; u.rate = 0.85; if (itVoice) u.voice = itVoice; speechSynthesis.speak(u); }
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say); });

  const quiz = document.getElementById('quiz');
  quiz.innerHTML = preguntas.map((q, i) => `
    <div class="card q" data-i="${i}">
      <div class="q-from">${q.from}</div>
      <div class="q-text" style="display:flex;align-items:center;gap:10px">${q.say ? `<button class="play" data-say="${esc(q.say)}">▶</button>` : ''}<span>${i + 1}. ${q.q}</span></div>
      ${q.opts
        ? `<div class="opts">${q.opts.map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>`
        : `<div class="fill"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe en italiano…"></div>`}
      <div class="feedback"></div>
    </div>`).join('');

  const chosen = {};
  quiz.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const card = b.closest('.q');
    card.querySelectorAll('.opt').forEach(x => x.style.borderColor = '');
    b.style.borderColor = 'var(--text)';
    chosen[card.dataset.i] = +b.dataset.j;
  });

  const norm = s => s.toLowerCase().trim().replace(/[’`]/g, "'").replace(/[¿?¡!.,;]/g, '').replace(/\s+/g, ' ');
  document.getElementById('check').onclick = function () {
    let ok = 0;
    const falladas = new Map();
    preguntas.forEach((q, i) => {
      const card = quiz.querySelector(`.q[data-i="${i}"]`);
      let good;
      if (q.opts) {
        const btns = card.querySelectorAll('.opt');
        btns.forEach(b => { b.disabled = true; b.style.borderColor = ''; });
        btns[q.a].classList.add('ok');
        good = chosen[i] === q.a;
        if (!good && chosen[i] !== undefined) btns[chosen[i]].classList.add('bad');
        if (!good && q.voc) Progreso.responder({ it: q.voc[0], es: q.voc[2], pr: q.voc[1], say: q.voc[0] }, false);
      } else {
        const inp = card.querySelector('input');
        inp.disabled = true;
        good = q.fill.map(norm).includes(norm(inp.value));
        inp.classList.add(good ? 'ok' : 'bad');
        if (!good) card.querySelector('.feedback').innerHTML = `Respuesta: <strong>${q.fill[0]}</strong>`;
      }
      if (good) ok++; else if (q.n) falladas.set(q.n, q.from);
    });
    const pct = ok / preguntas.length;
    let ex = {};
    try { ex = JSON.parse(localStorage.getItem('it-exams') || '{}'); } catch (e) {}
    ex[lv] = { best: Math.max(ex[lv] ? ex[lv].best : 0, pct), last: pct };
    try { localStorage.setItem('it-exams', JSON.stringify(ex)); } catch (e) {}
    Progreso.marcarActividad(0);

    document.getElementById('score').textContent = `${Math.round(pct * 100)}%`;
    document.getElementById('score-msg').textContent = pct >= PASA
      ? `Complimenti! 🎓 Aprobaste el nivel ${lv} (${ok} de ${preguntas.length}).`
      : `${ok} de ${preguntas.length}. Te falta un poco: necesitas ${PASA * 100}%. Repasa las clases de abajo y vuelve a intentarlo.`;
    document.getElementById('repasa').innerHTML = falladas.size
      ? `<strong>Clases para repasar:</strong><ul>${[...falladas].map(([n, t]) => `<li><a href="lezione.html?n=${n}">${n}. ${t}</a></li>`).join('')}</ul>`
      : '';
    document.getElementById('result').classList.add('on');
    this.style.display = 'none';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
  };
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});</script>
</body>
</html>
